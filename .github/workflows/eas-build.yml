name: EAS — Android APK build

on:
  push:
    branches: ["main", "master"]
    paths: ["package-4-mobile/**"]
  workflow_dispatch: {}   # Actions ট্যাব থেকে ম্যানুয়ালিও চালানো যাবে

jobs:
  build-android:
    needs: []  # চাইলে ci.yml-এর "mobile" জব সফল হওয়ার পরই চালাতে workflow_run ট্রিগার ব্যবহার করুন
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: package-4-mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install
      - name: EAS CLI ইনস্টল
        run: npm install -g eas-cli
      - name: Android APK বিল্ড (preview প্রোফাইল)
        run: eas build -p android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # --no-wait দেওয়া আছে যাতে GitHub Actions-এর নিজস্ব টাইম-লিমিটে (সাধারণত ৬ ঘণ্টা, কিন্তু
      # প্ল্যান অনুযায়ী কম হতে পারে) EAS-এর ক্লাউড বিল্ড শেষ হওয়ার জন্য না আটকে থাকে।
      # বিল্ডের অগ্রগতি ও ডাউনলোড লিংক expo.dev-এর ড্যাশবোর্ডে বা `eas build:list` দিয়ে দেখা যাবে।
